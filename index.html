<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>홈트</title>
<meta name="description" content="아파트 무소음 홈트레이닝 · 주 5회 20분 루틴, 동작 가이드, 스트레칭, 식단, 체크표">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#131311">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="홈트">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<style>
  :root{
    color-scheme:dark;
    --bg:#131311; --bar:#1A1A17; --line:#2F2E2A; --ink:#F2F0EB; --muted:#8B857C; --accent:#E5A05A;
    --nav-h:58px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overscroll-behavior:none}
  body{
    color:var(--ink);
    font-family:"Pretendard","Pretendard Variable",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    display:flex;flex-direction:column;
  }
  #screens{flex:1;position:relative;min-height:0}
  #screens iframe{
    position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);
    opacity:0;pointer-events:none;
  }
  #screens iframe.on{opacity:1;pointer-events:auto}
  #boot{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13.5px;transition:opacity .3s}
  #boot.gone{opacity:0;pointer-events:none}
  nav{
    flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);
    background:var(--bar);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    appearance:none;border:0;background:none;color:var(--muted);font:inherit;cursor:pointer;
    height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:0;transition:color .15s;-webkit-tap-highlight-color:transparent;
  }
  nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  nav button span{font-size:10.5px;font-weight:700;letter-spacing:-.01em}
  nav button[aria-selected="true"]{color:var(--accent)}
  nav button:active{opacity:.6}
  @media(min-width:760px){
    nav{grid-template-columns:repeat(5,minmax(0,150px));justify-content:center}
    nav button{flex-direction:row;gap:8px;height:52px}
    nav button span{font-size:13px}
  }
</style>
</head>
<body>

<main id="screens">
  <div id="boot">불러오는 중…</div>
</main>

<nav id="tabs" role="tablist"></nav>

<script>
const TABS=[
 {id:'tracker', src:'./tracker.html', label:'오늘',
  icon:'<path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h15A1.5 1.5 0 0 1 21 5.5v14a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 19.5z"/><path d="M3 9h18M8 2v4M16 2v4"/><path d="m8.5 14.5 2 2 4-4"/>'},
 {id:'routine', src:'./routine.html', label:'루틴',
  icon:'<path d="M6.5 7v10M17.5 7v10"/><path d="M3.5 9.5v5M20.5 9.5v5"/><path d="M6.5 12h11"/>'},
 {id:'moves',   src:'./moves.html',   label:'동작',
  icon:'<circle cx="12" cy="4.6" r="2.1"/><path d="M12 6.8v7M12 13.8 8.5 21M12 13.8 15.5 21M6.5 9.5 12 8.4l5.5 1.1"/>'},
 {id:'stretch', src:'./stretch.html', label:'스트레칭',
  icon:'<circle cx="8" cy="4.6" r="2.1"/><path d="M8 6.8v6M8 12.8 5 20M8 12.8l4 3.5M8 8.6l5-1.4 5 3"/><path d="M18 7.2 21 5"/>'},
 {id:'diet',    src:'./diet.html',    label:'식단',
  icon:'<path d="M6 3v8a2.5 2.5 0 0 0 5 0V3M8.5 3v6"/><path d="M17.5 3c-1.4 1.6-2 3.6-2 6 0 1.7.7 2.6 2 2.8V21"/><path d="M6 11.5V21"/>'},
];
const scr=document.getElementById('screens'), nav=document.getElementById('tabs'), boot=document.getElementById('boot');
const frames={};
let cur=null;

nav.innerHTML=TABS.map(t=>
 `<button role="tab" data-id="${t.id}" aria-selected="false" aria-label="${t.label}">
    <svg viewBox="0 0 24 24" aria-hidden="true">${t.icon}</svg><span>${t.label}</span></button>`).join('');

function show(id, opts){
  opts=opts||{};
  if(cur===id) return;
  const t=TABS.find(x=>x.id===id); if(!t) return;
  if(!frames[id]){
    const f=document.createElement('iframe');
    f.src=t.src; f.title=t.label; f.loading='eager';
    f.addEventListener('load',()=>{
      try{
        const d=f.contentDocument;
        if(d&&d.body) d.body.style.paddingBottom='calc(env(safe-area-inset-bottom) + 8px)';
      }catch(e){}
      if(opts.first) boot.classList.add('gone');
    });
    scr.appendChild(f); frames[id]=f;
  }
  Object.entries(frames).forEach(([k,f])=>f.classList.toggle('on',k===id));
  nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.id===id)));
  cur=id;
  try{
    if(opts.push) history.pushState({tab:id},'','#'+id);
    else history.replaceState({tab:id},'','#'+id);
  }catch(e){}
  try{ localStorage.setItem('ht-app-tab',id); }catch(e){}
}
nav.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.id,{push:true}); });

let start=(location.hash||'').replace('#','');
if(!TABS.some(t=>t.id===start)){
  try{ start=localStorage.getItem('ht-app-tab')||''; }catch(e){ start=''; }
}
if(!TABS.some(t=>t.id===start)) start='tracker';
show(start,{first:true});
setTimeout(()=>boot.classList.add('gone'),2500);

/* 안드로이드 뒤로가기 / 브라우저 뒤로·앞으로 = 이전 탭으로 */
window.addEventListener('popstate',e=>{
  const id=(e.state&&e.state.tab)||(location.hash||'').replace('#','');
  if(TABS.some(t=>t.id===id)) show(id);
});

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
